<div class="result-wrapper">
    <h2>Your InnerSource License Summary</h2>

    <div class="summary-box">
        <p class="summary-label">Selected clauses:</p>
        <pre class="clauses-text">{{ clauses_text }}</pre>
    </div>

    <p class="legal-notice">
        Please review the generated license text below.
        Further legal review is required before applying this license within your organization.
    </p>

    <div class="agreement-row">
        <label class="checkbox-label">
            <input type="checkbox" id="agree-checkbox" onchange="toggleDownloads(this)">
            I agree that this license must be legally reviewed before use.
            I do not hold FinOS liable for any damages resulting from its use.
        </label>

        <!-- Download buttons — enabled only after the checkbox is checked.
             Each is a form POST so the license text is sent in the body;
             no session cookie required. -->
        <div class="dl-button-row">

            <!-- Markdown -->
            <form action="/download/md" method="POST">
                <input type="hidden" name="license_text" value="{{ license_text | e }}">
                <button type="submit"
                        class="dl-btn dl-btn--md dl-btn--disabled"
                        aria-disabled="true"
                        title="Download as Markdown">
                    <!-- Markdown icon -->
                    <svg class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="M7 15V9l3 3 3-3v6"/>
                        <path d="M17 12l-2 3"/>
                        <path d="M15 12l2 3"/>
                    </svg>
                    <span>Download .MD</span>
                </button>
            </form>

            <!-- PDF -->
            <form action="/download/pdf" method="POST">
                <input type="hidden" name="license_text" value="{{ license_text | e }}">
                <button type="submit"
                        class="dl-btn dl-btn--pdf dl-btn--disabled"
                        aria-disabled="true"
                        title="Download as PDF">
                    <!-- PDF icon -->
                    <svg class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="9" y1="13" x2="9" y2="17"/>
                        <line x1="12" y1="11" x2="12" y2="17"/>
                        <line x1="15" y1="14" x2="15" y2="17"/>
                    </svg>
                    <span>Download PDF</span>
                </button>
            </form>

            <!-- Word -->
            <form action="/download/docx" method="POST">
                <input type="hidden" name="license_text" value="{{ license_text | e }}">
                <button type="submit"
                        class="dl-btn dl-btn--docx dl-btn--disabled"
                        aria-disabled="true"
                        title="Download as Word document">
                    <!-- Word / document icon -->
                    <svg class="dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="8" y1="13" x2="16" y2="13"/>
                        <line x1="8" y1="17" x2="16" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <span>Download Word</span>
                </button>
            </form>

        </div>
    </div>

    <script>
    function toggleDownloads(cb) {
        document.querySelectorAll('.dl-btn').forEach(function(btn) {
            btn.classList.toggle('dl-btn--disabled', !cb.checked);
            btn.setAttribute('aria-disabled', String(!cb.checked));
        });
    }
    </script>

    <details class="license-details">
        <summary>View full license text</summary>
        <pre class="license-text">{{ license_text }}</pre>
    </details>

    <div class="back-link-row">
        <a href="/" class="back-link">&#8592; Generate another license</a>
    </div>
</div>
